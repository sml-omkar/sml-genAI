<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyprus Admin — Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #f8f8f8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }
        .login-wrapper { width: 100%; max-width: 400px; padding: 20px; }
        .login-brand {
            display: flex; align-items: center; gap: 14px;
            margin-bottom: 32px; justify-content: center;
        }
        .login-brand .icon {
            width: 48px; height: 48px; background: #e00000;
            border-radius: 12px; display: flex; align-items: center;
            justify-content: center; color: white; font-size: 22px;
            font-weight: 700; box-shadow: 0 4px 16px rgba(224,0,0,0.2);
        }
        .login-brand h1 { font-size: 22px; color: #1a1a1a; font-weight: 600; }
        .login-brand small { display: block; font-size: 12px; color: #999; margin-top: 2px; }
        .login-card {
            background: white; border: 1px solid #e5e5e5;
            border-radius: 12px; padding: 32px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
        }
        .login-card h2 { font-size: 16px; color: #1a1a1a; margin-bottom: 4px; font-weight: 600; }
        .login-card .subtitle { font-size: 12px; color: #999; margin-bottom: 24px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 12px; color: #6e6e6e; margin-bottom: 6px; font-weight: 500; }
        .form-group input {
            width: 100%; padding: 10px 14px;
            background: #fafafa; border: 1px solid #e5e5e5;
            border-radius: 8px; color: #1a1a1a; font-size: 13px;
            font-family: inherit; outline: none; transition: border-color 0.15s;
        }
        .form-group input:focus { border-color: #e00000; box-shadow: 0 0 0 3px rgba(224,0,0,0.06); }
        .form-group input::placeholder { color: #999; }
        .login-btn {
            width: 100%; padding: 11px; background: #e00000;
            color: white; border: none; border-radius: 8px;
            font-size: 14px; font-weight: 600; cursor: pointer;
            font-family: inherit; transition: all 0.15s; margin-top: 4px;
        }
        .login-btn:hover { background: #c50000; box-shadow: 0 4px 16px rgba(224,0,0,0.2); }
        .login-btn:disabled { background: #ccc; cursor: not-allowed; box-shadow: none; }
        .error { color: #e00000; font-size: 12px; margin-top: 14px; display: none; text-align: center; }
        .back-link {
            display: block; text-align: center; margin-top: 20px;
            font-size: 12px; color: #999; text-decoration: none;
        }
        .back-link:hover { color: #1a1a1a; }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-brand">
            <div class="icon">C</div>
            <div>
                <h1>Cyprus AI</h1>
                <small>Admin Portal</small>
            </div>
        </div>
        <div class="login-card">
            <h2>Sign in</h2>
            <p class="subtitle">Enter your credentials to access the admin portal</p>
            <form onsubmit="return doLogin(event)">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" required autofocus placeholder="admin@company.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required placeholder="Password">
                </div>
                <button type="submit" class="login-btn" id="loginBtn">Sign In</button>
                <div class="error" id="error"></div>
            </form>
        </div>
        <a href="/" class="back-link">Back to Chatbot</a>
    </div>

    <script>
        if (localStorage.getItem('token')) window.location.href = '/admin/dashboard';
        async function doLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const err = document.getElementById('error');
            btn.textContent = 'Signing in...'; btn.disabled = true; err.style.display = 'none';
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST', headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
                });
                const data = await res.json();
                if (!res.ok) { err.textContent = data.detail || 'Login failed'; err.style.display = 'block'; return; }
                localStorage.setItem('token', data.access_token);
                localStorage.setItem('user', JSON.stringify(data.user));
                window.location.href = '/admin/dashboard';
            } catch(ex) { err.textContent = 'Connection failed'; err.style.display = 'block'; }
            btn.textContent = 'Sign In'; btn.disabled = false;
        }
    </script>
</body>
</html>
