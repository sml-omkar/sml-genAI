<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NXSS AI Admin — Login</title>
    <link rel="icon" type="image/png" href="/static/sml.png">
    <link rel="apple-touch-icon" href="/static/sml.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #0b0b0e;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }
        .login-wrapper { width: 100%; max-width: 400px; padding: 20px; }
        .login-brand {
            display: flex; align-items: center; gap: 14px;
            margin-bottom: 32px; justify-content: center;
        }
        .login-brand .icon {
            width: 48px; height: 48px; background: transparent;
            border-radius: 10px; display: flex; align-items: center;
            justify-content: center; overflow: hidden; padding: 0;
            border: none; box-shadow: none;
        }
        .login-brand .icon img { width: 100%; height: 100%; object-fit: contain; display: block; transform: scale(1.15); }
        .login-brand h1 { font-size: 22px; color: #f2f2f5; font-weight: 600; }
        .login-brand small { display: block; font-size: 12px; color: #70707a; margin-top: 2px; }
        .login-card {
            background: #16161b; border: 1px solid #2a2a33;
            border-radius: 12px; padding: 32px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.5);
        }
        .login-card h2 { font-size: 16px; color: #f2f2f5; margin-bottom: 4px; font-weight: 600; }
        .login-card .subtitle { font-size: 12px; color: #70707a; margin-bottom: 24px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 12px; color: #9b9ba5; margin-bottom: 6px; font-weight: 500; }
        .form-group input {
            width: 100%; padding: 10px 14px;
            background: #1a1a1f; border: 1px solid #2a2a33;
            border-radius: 8px; color: #f2f2f5; font-size: 13px;
            font-family: inherit; outline: none; transition: border-color 0.15s;
        }
        .form-group input:focus { border-color: #ff2d2d; box-shadow: 0 0 0 3px rgba(255,45,45,0.15); }
        .form-group input::placeholder { color: #55555f; }
        .login-btn {
            width: 100%; padding: 11px; background: #ff2d2d;
            color: white; border: none; border-radius: 8px;
            font-size: 14px; font-weight: 600; cursor: pointer;
            font-family: inherit; transition: all 0.15s; margin-top: 4px;
        }
        .login-btn:hover { background: #ff5252; box-shadow: 0 4px 16px rgba(255,45,45,0.3); }
        .login-btn:disabled { background: #3a3a44; cursor: not-allowed; box-shadow: none; color: #9b9ba5; }
        .error { color: #ff2d2d; font-size: 12px; margin-top: 14px; display: none; text-align: center; }
        .back-link {
            display: block; text-align: center; margin-top: 20px;
            font-size: 12px; color: #70707a; text-decoration: none;
        }
        .back-link:hover { color: #f2f2f5; }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-brand">
            <div class="icon"><img src="/static/sml.png" alt="SML Logo"></div>
            <div>
                <h1>NXSS AI</h1>
                <small>Admin Portal</small>
            </div>
        </div>
        <div class="login-card">
            <h2>Sign in</h2>
            <p class="subtitle">Enter your credentials to access the admin portal</p>
            <form onsubmit="return doLogin(event)">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" required autofocus placeholder="admin@company.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required placeholder="Password">
                </div>
                <button type="submit" class="login-btn" id="loginBtn">Sign In</button>
                <div class="error" id="error"></div>
            </form>
        </div>
        <a href="/" class="back-link">Back to Chatbot</a>
    </div>

    <script>
        if (localStorage.getItem('token')) window.location.href = '/admin/dashboard';
        async function doLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const err = document.getElementById('error');
            btn.textContent = 'Signing in...'; btn.disabled = true; err.style.display = 'none';
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST', headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
                });
                const data = await res.json();
                if (!res.ok) { err.textContent = data.detail || 'Login failed'; err.style.display = 'block'; return; }
                localStorage.setItem('token', data.access_token);
                localStorage.setItem('user', JSON.stringify(data.user));
                window.location.href = '/admin/dashboard';
            } catch(ex) { err.textContent = 'Connection failed'; err.style.display = 'block'; }
            btn.textContent = 'Sign In'; btn.disabled = false;
        }
    </script>
</body>
</html>
