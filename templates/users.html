{% extends "base.html" %}
{% block title %}Users — Cyprus AI{% endblock %}
{% block header %}
<div class="page-header">
    <h2>Users</h2>
    <button class="btn btn-primary" onclick="openAddModal()">+ Add User</button>
</div>
{% endblock %}
{% block content %}
<div class="card">
    <table>
        <thead>
            <tr><th>Email</th><th>Full Name</th><th>Department</th><th>Role</th><th style="text-align:right">Actions</th></tr>
        </thead>
        <tbody id="usersTable"></tbody>
    </table>
</div>

<div class="xp-modal" id="addModal">
    <div class="xp-modal-content" style="width:480px">
        <div class="xp-modal-header">
            <h3>Create New User</h3>
            <button class="xp-button xp-button-sm" onclick="document.getElementById('addModal').style.display='none'">Close</button>
        </div>
        <div class="xp-modal-body">
            <form id="addForm" onsubmit="return addUser(event)">
                <div class="form-row">
                    <div class="form-group"><label>Email</label><input type="email" name="email" required></div>
                    <div class="form-group"><label>Full Name</label><input type="text" name="full_name" required></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Password</label><input type="password" name="password" required></div>
                    <div class="form-group">
                        <label>Department</label>
                        <select name="department" id="userDeptSelect"></select>
                    </div>
                </div>
                <div class="form-group" style="margin-bottom:16px">
                    <label>Role</label>
                    <select name="role">
                        <option value="user">User</option>
                        <option value="dept_admin">Dept Admin</option>
                        <option value="super_admin">Super Admin</option>
                    </select>
                </div>
                <div id="userError" style="color:var(--red);font-size:12px;margin-bottom:12px;display:none"></div>
                <div class="xp-form-actions">
                    <button type="submit" class="btn btn-primary">Create User</button>
                    <button type="button" class="btn" onclick="document.getElementById('addModal').style.display='none'">Cancel</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    async function loadDepts() {
        const r = await authFetch('/api/departments/all');
        const depts = await r.json();
        document.getElementById('userDeptSelect').innerHTML = depts.map(d =>
            `<option value="${d.slug}">${d.name}</option>`
        ).join('');
    }

    async function openAddModal() {
        await loadDepts();
        document.getElementById('addModal').style.display = 'flex';
    }

    async function loadUsers() {
        const r = await authFetch('/api/admin/users');
        const data = await r.json();
        const users = data.users || data;
        document.getElementById('usersTable').innerHTML = users.map(u => `
            <tr>
                <td>${u.email}</td>
                <td>${u.full_name}</td>
                <td><span class="badge badge-${u.department}">${u.department.toUpperCase()}</span></td>
                <td><span class="badge badge-${u.role}">${u.role.replace('_',' ')}</span></td>
                <td style="text-align:right">
                    <button class="btn btn-sm btn-danger" onclick="deleteUser('${u.id}')">Delete</button>
                </td>
            </tr>
        `).join('');
    }

    async function addUser(e) {
        e.preventDefault();
        const fd = new FormData(e.target);
        const data = Object.fromEntries(fd);
        const errEl = document.getElementById('userError');
        errEl.style.display = 'none';

        const r = await authFetch('/api/admin/users', {
            method: 'POST',
            body: JSON.stringify(data)
        });

        if (r.ok) {
            document.getElementById('addModal').style.display = 'none';
            loadUsers();
            e.target.reset();
        } else {
            const err = await r.json();
            errEl.textContent = err.detail || 'Failed to create user';
            errEl.style.display = 'block';
        }
        return false;
    }

    async function deleteUser(id) {
        if (!confirm('Delete user?')) return;
        const r = await authFetch(`/api/admin/users/${id}`, { method: 'DELETE' });
        if (r.ok) loadUsers();
    }

    loadUsers();
</script>
{% endblock %}
