# =============================================================================
# AI-Bot Docker Compose
# For container-based deployment (alternative to direct EC2 hosting)
# =============================================================================

services:
  # --- Main Application (FastAPI + Bot + Admin UI) ---
  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Point the Ollama python client at the Ollama service in this network
      OLLAMA_HOST: http://ollama:11434
      # Point the cache service at the Redis container in this network
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started
      ollama:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - upload_data:/app/data/uploads
      - chroma_data:/app/data/chroma
    restart: unless-stopped

  # --- PostgreSQL ---
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: aibot_user
      POSTGRES_PASSWORD: aibot_pass_2024
      POSTGRES_DB: aibot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aibot_user -d aibot_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --- ChromaDB ---
  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8100:8000"
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped

  # --- Ollama (local embedding runtime: nomic-embed-text) ---
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "-1"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # --- Redis (query-answer cache backend) ---
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped


  # --- Ollama Model Initializer (pulls nomic-embed-text on first start) ---
  # Needs OLLAMA_HOST pointing at the ollama service — this container does NOT
  # run its own server, it only drives the `ollama` CLI against the server.
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "Waiting for Ollama to be ready..."
        until ollama list >/dev/null 2>&1; do sleep 2; done
        echo "Pulling nomic-embed-text..."
        ollama pull nomic-embed-text
        echo "Model ready."
    restart: "no"

volumes:
  postgres_data:
  chroma_data:
  upload_data:
  ollama_data:
  redis_data:
